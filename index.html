<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kids Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: home = three big kid cards; kid page = score band, good/bad tile grids, Roblox timer panel. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1d2433; --muted:#5f6b80; --line:#dde3ee;
  --good:#1f9d63; --good-soft:#e2f6ec; --bad:#d9443a; --bad-soft:#fde6e3;
  --gold:#f2a516; --gold-soft:#fff2d6;
  --dior:#2a7de1; --diane:#e0a100; --dylan:#c14fd6;
  --display:"Titan One","Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:12px; --edge:#1d2433;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141824; --surface:#1e2433; --ink:#eef1f7; --muted:#a3adc2; --line:#2e3547;
  --good:#3cc584; --good-soft:#173628; --bad:#ff6b5e; --bad-soft:#3b1f1d;
  --gold:#ffbf3c; --gold-soft:#3a2f14;
  --dior:#5aa2ff; --diane:#ffd34d; --dylan:#e47bf2; --edge:#05070c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1e2433; --ink:#eef1f7; --muted:#a3adc2; --line:#2e3547;
  --good:#3cc584; --good-soft:#173628; --bad:#ff6b5e; --bad-soft:#3b1f1d;
  --gold:#ffbf3c; --gold-soft:#3a2f14;
  --dior:#5aa2ff; --diane:#ffd34d; --dylan:#e47bf2; --edge:#05070c; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--diane);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(30px,5vw,44px)}
.date{color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px}
.pill.special{background:var(--gold-soft);color:var(--ink)}
.small-btn{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;font-size:16px}

/* Home */
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.kid-card{background:var(--surface);border-radius:var(--r);padding:22px;text-align:left;display:flex;flex-direction:column;gap:14px;
  border:3px solid transparent;box-shadow:0 6px 0 var(--kc);transition:transform .12s}
.kid-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--kc)}
.kid-card .face{width:72px;height:72px;border-radius:50%;background:var(--kc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700}
.kid-card .row{display:flex;align-items:center;gap:14px}
.kid-card h2{font-size:34px;color:var(--kc)}
.meter{height:18px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--kc);border-radius:999px;transition:width .3s}
.stat{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
.prize{background:var(--gold-soft);border-radius:14px;padding:10px 12px;font-weight:800;display:flex;align-items:center;gap:8px}

/* Kid page */
.kid-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{width:64px;height:64px;border-radius:50%;background:var(--surface);font-size:30px;border:2px solid var(--line);flex:none}
.kid-head h1{font-size:clamp(34px,6vw,52px);color:var(--kc)}
.score{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.score .big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:24px;color:var(--muted)}
.score .meter{height:26px}
.score .msg{font-weight:800;font-size:20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:24px;display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{border-radius:18px;padding:14px 10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:800;font-size:17px;line-height:1.15}
.tile .e{font-size:40px;line-height:1}
.tile .p{font-family:var(--display);font-size:20px}
.tile.good{background:var(--good-soft);border:3px solid var(--good)}
.tile.good .p{color:var(--good)}
.tile.bad{background:var(--bad-soft);border:3px solid var(--bad)}
.tile.bad .p{color:var(--bad)}
.tile.done{opacity:.55;cursor:default}
.tile:active{transform:scale(.96)}
.tile.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}

.roblox{display:flex;flex-direction:column;gap:14px}
.clock{font-family:var(--display);font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock-sub{color:var(--muted);font-weight:800}
.go{width:100%;min-height:96px;border-radius:20px;font-family:var(--display);font-size:32px;font-weight:700;color:#fff;background:var(--good)}
.go.stop{background:var(--bad)}
.go:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.alert{border-radius:14px;padding:12px 14px;font-weight:800}
.alert.warn{background:var(--gold-soft)}
.alert.over{background:var(--bad-soft);color:var(--bad)}

.log{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.log-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:700}
.log-item .t{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;min-width:52px}
.log-item .l{flex:1;min-width:0}
.log-item .p{font-family:var(--display);font-weight:700}
.log-item .p.g{color:var(--good)} .log-item .p.b{color:var(--bad)}
.x{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px}
.empty{color:var(--muted);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:14px 20px;border-radius:16px;font-weight:800;display:flex;gap:12px;align-items:center;z-index:20;max-width:calc(100% - 32px)}
.toast button{background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:800}

/* Parent */
.parent{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;height:52px;border-radius:14px;background:var(--bg);font-size:26px;font-weight:800;border:2px solid var(--line)}
.stepper span{min-width:70px;text-align:center;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.toggle{min-width:120px;padding:14px 18px;border-radius:14px;font-weight:800;background:var(--bg);border:2px solid var(--line)}
.toggle.on{background:var(--gold);border-color:var(--gold);color:#1d2433}
.pin{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pin input{font:inherit;font-size:28px;letter-spacing:.3em;width:160px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.hint{color:var(--muted);font-weight:700;font-size:15px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:700}
.pm{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.chip.g{background:var(--good-soft);color:var(--good)} .chip.b{background:var(--bad-soft);color:var(--bad)}
.score .chip{font-size:26px;padding:8px 18px}
.stars{font-size:28px;letter-spacing:2px;min-height:34px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:120px;animation:rise 1.1s ease-out forwards;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.float.g{color:var(--good)} .float.b{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.bit{position:absolute;font-size:36px;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--rot))}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.party{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(0,0,0,.35);padding:16px}
.party div{background:var(--surface);border-radius:28px;padding:32px 28px;text-align:center;max-width:520px;display:flex;flex-direction:column;gap:12px;animation:pop .5s}
.party h2{font-size:44px;color:var(--gold)}
.party p{font-size:22px;font-weight:800;margin:0}
.party button{background:var(--good);color:#fff;border-radius:16px;padding:16px;font-family:var(--display);font-size:26px;font-weight:700}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.savetop .savebtn{margin:0;padding:12px}
#saveDock{position:sticky;bottom:0;z-index:50;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none}#saveDock[hidden]{display:none}#saveDock .savebtn{pointer-events:auto;max-width:520px;margin:0}
.savebtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;margin:6px 0 14px;padding:12px;border:3px solid var(--edge,#1d2433);border-radius:var(--r);background:var(--good);color:#fff;font:inherit;font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--edge,#1d2433);cursor:pointer}.savebtn small{font-size:14px;font-weight:700;opacity:.95}.savebtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge,#1d2433)}
.syncwarn{background:var(--bad-soft);border:3px solid var(--bad);border-radius:var(--r);padding:12px 16px;margin:0 0 14px;font-weight:700;font-size:15px;line-height:1.35}.syncwarn a{color:var(--ink);word-break:break-all}
.waitbar{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 14px;padding:14px 18px;border:3px solid var(--gold);border-radius:var(--r);background:var(--gold-soft);color:var(--ink);font:inherit;font-weight:800;font-size:18px;text-align:left;cursor:pointer;animation:wbpulse 2s ease-in-out infinite}
.waitbar small{font-weight:700;font-size:14px;color:var(--muted)}
.wb-n{min-width:44px;height:44px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:22px}
@keyframes wbpulse{50%{box-shadow:0 0 0 6px rgba(242,165,22,.25)}}
.award{background:var(--gold-soft);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px}
.award .medal{font-size:46px;line-height:1}
.award h3{font-size:22px}
.award .who{font-family:var(--display);font-size:26px;font-weight:700}
.award .hint{font-size:14px}
.tabs{display:flex;gap:10px}
.tabs button{padding:12px 22px;border-radius:14px;font-weight:800;background:var(--surface);border:2px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trend{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.trend-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.trend-head h3{font-size:26px;color:var(--kc)}
.trend-head .tot{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.prize-in{font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1;max-width:320px}
.chip.w{background:var(--gold-soft);color:var(--ink)}
.chip.t{background:var(--gold-soft);color:var(--ink)}
.badge{background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-size:14px}
.log-item{flex-wrap:wrap}
.log-item.rv{flex-wrap:wrap}
.log-item .ok{background:var(--good-soft);color:var(--good);border-radius:10px;padding:8px 14px;font-weight:800;font-size:18px}
.chg{font:inherit;font-weight:700;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.game{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px}
.fire{background:var(--gold-soft);padding:4px 12px;border-radius:999px}
.fire.off{opacity:.45}
.fire{white-space:nowrap;align-self:center;line-height:1.2}
.game{flex-wrap:wrap}
.logo{margin-bottom:10px}
.meter.lv{height:12px}
.meter.lv i{background:var(--gold)}
/* Blocky building-brick look */
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:48px 48px}
:root{--grid:rgba(29,36,51,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grid:rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--grid:rgba(255,255,255,.04)}
.kid-card,.panel,.score,.award,.trend,.parent,.prize{border-radius:var(--r);border:3px solid var(--edge)}
.kid-card{box-shadow:0 8px 0 var(--edge)}
.kid-card:active{box-shadow:0 2px 0 var(--edge)}
.kid-card .face{border-radius:10px;width:76px;height:84px;background:var(--kc);border:3px solid var(--edge);overflow:hidden;align-items:end}
.kid-card .face .av{margin-top:2px}
.tile{border-radius:10px;box-shadow:0 6px 0 var(--edge)}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.tile.done{box-shadow:none}
.small-btn,.toggle,.tabs button,.stepper button{border:3px solid var(--edge);border-radius:10px;box-shadow:0 4px 0 var(--edge)}
.small-btn:active,.toggle:active,.tabs button:active,.stepper button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.back{border:3px solid var(--edge);border-radius:10px;box-shadow:0 4px 0 var(--edge)}
.go{border:3px solid var(--edge);border-radius:12px;box-shadow:0 8px 0 var(--edge)}
.go:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--edge)}
.chip,.pill,.fire{border-radius:8px;border:2px solid var(--edge)}
.meter{border-radius:6px;border:3px solid var(--edge);height:22px!important;background:var(--surface)}
.meter i{border-radius:2px}
.log-item,.alert,.toast,.x,.log-item .ok{border-radius:8px}
.toast{border:3px solid var(--edge)}
.party div{border:4px solid var(--edge);border-radius:var(--r);box-shadow:0 10px 0 var(--edge)}
.party button{border:3px solid var(--edge);border-radius:10px;box-shadow:0 5px 0 var(--edge)}
h1,h2,h3,.big,.clock,.who{letter-spacing:.02em}
.logo{display:flex;flex-direction:column;gap:6px}
.lw{display:flex;gap:5px}
.lb{display:grid;place-items:center;width:clamp(34px,6.4vw,50px);height:clamp(34px,6.4vw,50px);border:3px solid var(--edge);border-radius:7px;box-shadow:0 5px 0 var(--edge);
  font-family:var(--display);font-size:clamp(20px,4vw,30px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
.av{display:block;flex:none;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.av .arm-r{transform-origin:47px 52px;animation:wave 7s ease-in-out infinite}
.av .arm-l{transform-origin:12px 52px;animation:waveL 7s ease-in-out infinite}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.av .smile{transform-box:fill-box;transform-origin:center;animation:smileA 5s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes smileA{0%,100%{transform:scale(1)}50%{transform:scale(1.18,1.25)}}
@keyframes waveL{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(150deg)}68%{transform:rotate(120deg)}74%{transform:rotate(150deg)}80%{transform:rotate(120deg)}86%{transform:rotate(0)}}
@keyframes wave{0%,8%,45%,100%{transform:rotate(0)}15%{transform:rotate(-150deg)}21%{transform:rotate(-120deg)}27%{transform:rotate(-150deg)}33%{transform:rotate(-120deg)}39%{transform:rotate(0)}}
.av .frown{display:none}
.av.hop{animation:hop .7s ease-out 2}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(4px) scale(1.08,.9)}60%{transform:translateY(-26px) scale(.95,1.08)}}
.av.hop .arm-r{animation:cheer .35s ease-in-out 4}
@keyframes cheer{0%,100%{transform:rotate(-160deg)}50%{transform:rotate(-120deg)}}
.av.sad{animation:droop 1.2s ease-out}
@keyframes droop{0%{transform:translateY(0)}30%{transform:translateY(5px) rotate(-6deg)}100%{transform:translateY(0) rotate(0)}}
.av.sad .smile{display:none}.av.sad .frown{display:block}
.kid-head{padding-top:24px}
.kid-head .av{margin:0 -4px}
/* TV and wide landscape screens */
button:focus,select:focus,input:focus{outline:5px solid var(--gold);outline-offset:3px}
button:focus{transform:scale(1.04);z-index:2;position:relative}
.tile:focus{transform:scale(1.06)}
@media (min-width:1300px){.wrap{max-width:1500px}body{zoom:1.15}}
@media (min-width:1900px){body{zoom:1.35}}
@media (orientation:landscape) and (min-width:900px){.score{display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:center}.score>*{grid-column:2}.score .big{grid-column:1;grid-row:1/span 6}}
.datebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:3px solid var(--edge);border-radius:var(--r);padding:12px 16px;box-shadow:0 6px 0 var(--edge)}
.datebar .dt{flex:1;min-width:200px;text-align:center}
.datebar .wd{font-family:var(--display);font-size:clamp(34px,6vw,56px);line-height:1}
.datebar .dm{font-weight:800;font-size:clamp(18px,3vw,26px);color:var(--muted)}
.datebar .rel{display:inline-block;margin-top:4px;padding:2px 12px;border-radius:8px;border:2px solid var(--edge);background:var(--gold-soft);font-weight:800}
.datebar .rel.now{background:var(--good-soft);color:var(--good)}
.dnav{width:72px;height:72px;border:3px solid var(--edge);border-radius:12px;background:var(--bg);font-size:30px;font-weight:800;box-shadow:0 5px 0 var(--edge)}
.dnav:disabled{opacity:.3;box-shadow:none;cursor:not-allowed}
.dnav:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.meter{position:relative}

const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d)};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dkey(d)};
const weekStart=()=>{const d=new Date();const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return dkey(d)}; // week starts Monday
const START_DATE="2026-10-17"; // first day of using the app: nothing earlier is shown or counted
const monthStart=()=>{const d=new Date();d.setDate(1);return dkey(d)};
const rangeDays=(from)=>{const out=[];const d=new Date((from<START_DATE?START_DATE:from)+"T12:00:00");const t=today();while(dkey(d)<=t){out.push(dkey(d));d.setDate(d.getDate()+1)}return out};
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+":"+pad(m):m)+":"+pad(ss)};
const mins=ms=>Math.floor(Math.max(0,ms)/60000);

const unsubs=[];let subDate=null;
function subscribe(){
  if(!db) return;
  unsubs.splice(0).forEach(u=>u());
  subDate=today();
  unsubs.push(db.doc("settings/main").onSnapshot(s=>{if(s.exists){settings={...DEFAULTS,...s.data()};render()}},e=>console.warn(e)));
  unsubs.push(db.collection("days").where("date",">=",daysAgo(40)).onSnapshot(q=>{
    const seen=new Set();
    for(const doc of q.docs){seen.add(doc.id);cache[doc.id]=JSON.parse(JSON.stringify(doc.data()))}
    // the server is the truth: drop old copies this device still remembers (e.g. after a reset)
    const from=daysAgo(40);
    for(const id of Object.keys(cache)){if(!seen.has(id)&&id.slice(0,10)>=from){delete cache[id];try{localStorage.removeItem("kd:days/"+id)}catch(e){}}}
    render();
  },e=>console.warn(e)));
}

// ---- derived ----
const isOk=x=>x.s!=="p";
const points=day=>day.log.reduce((a,x)=>a+(isOk(x)?x.p:0),0);
const pendingList=day=>day.log.filter(x=>!isOk(x));
const projected=day=>day.log.reduce((a,x)=>a+x.p,0);
const trust=kid=>Object.values(cache).filter(d=>d.kid===kid).reduce((a,d)=>a+d.log.reduce((b,x)=>b+(x.tr||0),0),0);
const LEVELS=[{n:"Seedling",e:"🌱",at:0},{n:"Explorer",e:"🧭",at:40},{n:"Hero",e:"🦸",at:100},{n:"Champion",e:"🏆",at:180},{n:"Superstar",e:"🌟",at:280},{n:"Legend",e:"👑",at:400}];
const lifetime=kid=>Object.values(cache).filter(d=>d.kid===kid).reduce((a,d)=>a+points(d),0);
function levelOf(kid){const xp=Math.max(0,lifetime(kid));let i=0;while(i+1<LEVELS.length&&xp>=LEVELS[i+1].at) i++;
  const cur=LEVELS[i],nx=LEVELS[i+1];return {cur,nx,xp,pct:nx?(xp-cur.at)/(nx.at-cur.at)*100:100,num:i+1}}
function streak(kid){let n=0;let i=0;if(dayPts(kid,today())>=settings.target) n=1;i=1;
  for(;i<40&&daysAgo(i)>=START_DATE;i++){if(dayPts(kid,daysAgo(i))>=settings.target) n++;else break}return n}
const gameHTML=kid=>{const L=levelOf(kid),st=streak(kid);
  return `<div class="game"><span class="lvl">${L.cur.e} Level ${L.num} · ${L.cur.n}</span><span class="fire ${st?"":"off"}">🔥 ${st}</span></div>
  <div class="meter lv"><i style="width:${L.pct}%"></i></div>
  <div class="hint">${L.nx?`${L.nx.at-L.xp} more points to ${L.nx.e} ${L.nx.n}`:"Top level! 👑"}</div>`};
const allPending=()=>{const out=[];for(const d of Object.values(cache)) for(const e of d.log) if(!isOk(e)) out.push({kid:d.kid,date:d.date,e});return out.sort((a,b)=>a.e.t-b.e.t)};
const plus=day=>day.log.reduce((a,x)=>a+(isOk(x)&&x.p>0?x.p:0),0);
const minus=day=>day.log.reduce((a,x)=>a+(isOk(x)&&x.p<0?-x.p:0),0);
const chips=d=>`<div class="pm"><span class="chip g">⬆️ +${plus(d)}</span><span class="chip b">⬇️ −${minus(d)}</span>${pendingList(d).length?`<span class="chip w">⏳ ${pendingList(d).length} waiting</span>`:""}</div>`;
const starRow=(pts,t)=>{const n=Math.max(0,Math.min(5,Math.floor(pts/t*5)));return "⭐".repeat(n)+"<span style='opacity:.25'>"+"⭐".repeat(5-n)+"</span>"};
const isSpecial=(date=today())=>!!settings.specialDays[date];
const limitMs=()=>(isSpecial()?settings.specialMin:settings.normalMin)*60000;
const playedMs=(day,now=Date.now())=>day.sessions.reduce((a,s)=>a+(s.end-s.start),0)+(day.runStart?now-day.runStart:0);
const earnedPrize=kid=>{const y=cache[dayId(kid,yesterday())];return y&&points(y)>=settings.target?y:null};

const dayPts=(kid,date)=>{const d=cache[dayId(kid,date)];return d?points(d):0};
const total=(kid,days)=>days.reduce((a,d)=>a+dayPts(kid,d),0);
function starOf(days){
  const sc=KIDS.map(k=>({k,t:total(k.id,days)})).sort((a,b)=>b.t-a.t);
  if(sc[0].t<=0) return null;
  return sc.filter(x=>x.t===sc[0].t);
}
function trendSVG(kid,days,color){
  const W=600,H=170,P=26;
  const vals=days.map(d=>dayPts(kid,d));
  const tgt=settings.target;
  const max=Math.max(tgt+2,...vals),min=Math.min(0,...vals);
  const x=i=>days.length<2?W/2:P+i*(W-2*P)/(days.length-1);
  const y=v=>H-P-(v-min)/(max-min||1)*(H-2*P);
  let segs="";
  for(let i=1;i<vals.length;i++){const up=vals[i]>=vals[i-1];
    segs+=`<line x1="${x(i-1)}" y1="${y(vals[i-1])}" x2="${x(i)}" y2="${y(vals[i])}" stroke="${up?"var(--good)":"var(--bad)"}" stroke-width="6" stroke-linecap="round"/>`}
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?8:5}" fill="${v>=tgt?"var(--gold)":color}"/>`).join("");
  const showLbl=days.length<=8;
  const lbls=days.map((d,i)=>(showLbl||i%5===0||i===days.length-1)?`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">${showLbl?new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short"}):+d.slice(8)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily points">
    <line x1="${P}" x2="${W-P}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="${W-P}" y="${y(tgt)-6}" text-anchor="end" font-size="13" font-weight="800" fill="var(--gold)">🎯 ${tgt}</text>
    ${min<0?`<line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="2"/>`:""}
    ${segs}${dots}${lbls}</svg>`;
}

  const entry={id:Math.random().toString(36).slice(2,9),t:Date.now(),a:act.id,e:act.e,l:act.l,p:act.p,s:isToday()&&!act.parent?"p":"ok"};
  day.log.unshift(entry);saveDay(day);
  lastAdd={kid,id:entry.id};
  celebrate(act.p);sfx(act.p>0?"good":"bad");

function removeEntry(kid,id,date=viewDate){
  const day=structuredClone(getDay(kid,date));
  const e=day.log.find(x=>x.id===id);
  day.log=day.log.filter(x=>x.id!==id);
  if(e&&e.a==="roblox_over") day.overPenalty=false;
  saveDay(day);
}
function mutateEntry(kid,date,id,fn){
  const day=structuredClone(getDay(kid,date));const e=day.log.find(x=>x.id===id);if(!e) return;
  fn(day,e);saveDay(day);
}
function addNight(kid,actId){
  const act=ALL.find(x=>x.id===actId),date=yesterday();
  if(date<START_DATE){showToast("Bedtime points start from tomorrow morning");return}
  const day=structuredClone(getDay(kid,date));
  if(day.log.some(x=>x.a===act.id)){showToast("Already added for last night");return}
  day.log=day.log.filter(x=>!(x.a==="slept_early"||x.a==="slept_late")||x.a===act.id);
  day.log.unshift({id:Math.random().toString(36).slice(2,9),t:Date.now(),a:act.id,e:act.e,l:act.l,p:act.p,s:"ok",tr:0});
  sfx(act.p>0?"fanfare":"bad");if(act.p>0)celebrate(act.p);saveDay(day);
  showToast((act.p>0?"+":"")+act.p+" "+act.l+" · "+kidById(kid).name);

  day.log.unshift({id:Math.random().toString(36).slice(2,9),t:Date.now(),a:"bonus",e:"🌟",l:"Bonus from Dad"+(why?": "+why:""),p:n,s:"ok",tr:0});

const confirmEntry=(k,d,i)=>{sfx("confirm");mutateEntry(k,d,i,(day,e)=>{e.s="ok";e.tr=1})};
const denyEntry=(k,d,i)=>{sfx("deny");mutateEntry(k,d,i,(day,e)=>{day.log=day.log.filter(x=>x.id!==i)})};
const changeEntry=(k,d,i,aid)=>{const a=ALL.find(x=>x.id===aid);if(!a) return;mutateEntry(k,d,i,(day,e)=>{e.a=a.id;e.e=a.e;e.l=a.l;e.p=a.p;e.s="ok";e.tr=0})};

  sfx("confirm");
  for(const d of Object.values(cache).filter(d=>d.kid===kid&&d.log.some(x=>!isOk(x)))){
    const c=structuredClone(d);c.log.forEach(e=>{if(!isOk(e)){e.s="ok";e.tr=1}});saveDay(c);

function startPlay(kid){
  const day=structuredClone(getDay(kid,today()));
  if(day.runStart) return;
  day.runStart=Date.now();sfx("start");saveDay(day);
}
function stopPlay(kid){
  const day=structuredClone(getDay(kid,today()));
  if(!day.runStart) return;
  sfx("stop");day.sessions.push({start:day.runStart,end:Date.now()});day.runStart=null;
  checkOver(day);saveDay(day);
}
function checkOver(day){
  // one automatic penalty per day, 2 minutes grace after the daily limit
  if(!day.overPenalty&&playedMs(day)>limitMs()+120000){
    const a=BAD.find(b=>b.id==="roblox_over");
    day.overPenalty=true;
    day.log.unshift({id:Math.random().toString(36).slice(2,9),t:Date.now(),a:a.id,e:a.e,l:a.l+" (auto)",p:a.p,s:"ok"});
    return true;
  }
  return false;
}

const AREAS=[
  {id:"study",e:"📚",n:"Study",acts:["homework","study_time","reading","late_study"]},

  {id:"bonus",e:"🌟",n:"Bonus",acts:["bonus"]}];
const areaOf=aid=>AREAS.find(a=>a.acts.includes(aid));
function areaStats(kid,days){
  const st={};AREAS.forEach(a=>st[a.id]={g:0,b:0,n:0});
  for(const d of days){const doc=cache[dayId(kid,d)];if(!doc) continue;

function topActs(kid,days,good){

}
function areaHTML(k,days,prevDays,label){

    <div class="abar"><div class="neg"><i style="width:${st[a.id].b/max*100}%"></i></div><div class="pos"><i style="width:${st[a.id].g/max*100}%"></i></div></div>
    <span class="av2"><b class="g">+${st[a.id].g}</b> <b class="b">−${st[a.id].b}</b></span></div>`).join("");
  let verdict="";
  if(used.length){
    const best=[...used].sort((x,y)=>net(y)-net(x))[0],worst=[...used].sort((x,y)=>net(x)-net(y))[0];
    const goodLine=net(best)>0?`<div class="vd g">💪 Best at <b>${best.n}</b> (${net(best)>0?"+":""}${net(best)} points)</div>`:"";
    const badLine=(net(worst)<0||st[worst.id].b>0)&&worst.id!==best.id||net(worst)<0?`<div class="vd b">⚠️ Needs work: <b>${worst.n}</b> (${st[worst.id].b} points lost${st[worst.id].g?`, ${st[worst.id].g} earned`:""})</div>`:"";
    const untouched=AREAS.filter(a=>a.id!=="bonus"&&a.id!=="screen"&&st[a.id].g===0);
    const noneLine=untouched.length?`<div class="vd w">🔎 Nothing earned yet in: ${untouched.map(a=>a.e+" "+a.n).join(", ")}</div>`:"";
    verdict=goodLine+badLine+noneLine;
  }else verdict=`<div class="vd w">No confirmed activity ${label} yet.</div>`;
  const tg=topActs(k.id,days,true),tb=topActs(k.id,days,false);
  const fmtTop=l=>l.map(x=>`${x.e} ${esc(x.l)} ×${x.c}`).join(" · ");

function tick(){
  if(db&&subDate&&subDate!==today()){subscribe();}
  const now=Date.now();
  document.querySelectorAll("[data-left]").forEach(el=>{el.textContent=fmt(limitMs()-playedMs(getDay(el.dataset.left,today()),now))});
  if(view.screen!=="kid") return;
  const d=getDay(view.kid,today()),used=playedMs(d,now),lim=limitMs();
  const clock=$("#clock");if(!clock) return;
  const chunk=d.runStart?now-d.runStart:0;
  clock.textContent=d.runStart?fmt(chunk):fmt(used);
  $("#clockSub").textContent=d.runStart?"this time · "+mins(used)+" min today":"played today";
  $("#leftTxt").textContent=used>=lim?"No time left today":fmt(lim-used)+" left";
  $("#playBar").style.width=Math.min(100,used/lim*100)+"%";
  const go=$("#goBtn");
  go.disabled=!d.runStart&&used>=lim;
  if(go.disabled) go.textContent="⛔ No more Roblox today";
  let a="";
  if(used>=lim&&d.runStart&&!window.__alarmed){window.__alarmed=true;sfx("alarm")}
  if(used>=lim) a=`<div class="alert over">⏰ Time's up! Please stop Roblox now.</div>`;
  else if(d.runStart&&chunk>=settings.chunkMin*60000) a=`<div class="alert warn">🧃 ${settings.chunkMin} minutes done. Time for a break!</div>`;
  else if(lim-used<10*60000) a=`<div class="alert warn">⌛ Less than 10 minutes left today.</div>`;
  const pa=$("#playAlert");if(pa.innerHTML!==a) pa.innerHTML=a;
  // auto penalty while still playing past the limit
  if(d.runStart&&!d.overPenalty&&used>lim+120000){const c=structuredClone(d);if(checkOver(c)){saveDay(c);showToast("−3 Went over Roblox time")}}
}

const FOC="button:not([disabled]),select,input";

function moveFocus(dir){
  const list=focusables();const cur=document.activeElement&&list.includes(document.activeElement)?document.activeElement:null;

/* Shared online store without sign-in: one JSON document on a public blob service. Null = off. */
const BLOB_URL=null;
function openBlob(url){
  let docs={},last="",pending=0,chain=Promise.resolve(),ready=false;const subs=new Set();
  const get=async()=>{const r=await fetch(url,{headers:{Accept:"application/json"},cache:"no-store"});if(!r.ok) throw new Error("GET "+r.status);const j=await r.json();return (j&&j.docs)||{}};
  const put=async d=>{const r=await fetch(url,{method:"PUT",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({docs:d,rev:Date.now()})});if(!r.ok) throw new Error("PUT "+r.status)};
  const tell=()=>subs.forEach(f=>f());
  const fresh=d=>{const j=JSON.stringify(d);if(j===last) return false;last=j;docs=d;return true};
  const poll=async()=>{if(pending||document.hidden) return;try{const d=await get();if(pending) return;if(fresh(d)||!ready){ready=true;tell()}}catch(e){console.warn(e)}};
  const mutate=fn=>{pending++;const run=chain.then(async()=>{let lastErr;for(let i=0;i<3;i++){try{const d=await get();fn(d);const cut=daysAgoKey(45);for(const k of Object.keys(d)) if(k.startsWith("days/")&&k.slice(5)<cut) delete d[k];await put(d);fresh(d);ready=true;tell();return}catch(e){lastErr=e;await new Promise(r=>setTimeout(r,400))}}throw lastErr}).finally(()=>{pending--});chain=run.catch(()=>{});return run};
  const dayList=min=>Object.keys(docs).filter(k=>k.startsWith("days/")).map(k=>({id:k.slice(5),data:()=>docs[k]})).filter(x=>!min||x.id>=min);
  setInterval(poll,3500);document.addEventListener("visibilitychange",()=>{if(!document.hidden) poll()});
  return get().then(d=>{fresh(d);ready=true;return {
    doc:path=>({set:data=>mutate(d=>{d[path]=JSON.parse(JSON.stringify(data))}),
      onSnapshot:(cb)=>{const f=()=>cb({exists:path in docs,data:()=>docs[path]});subs.add(f);f();return()=>subs.delete(f)}}),
    collection:c=>({where:(field,op,val)=>({onSnapshot:cb=>{const f=()=>cb({docs:dayList(val)});subs.add(f);f();return()=>subs.delete(f)}})})}});
}
const daysAgoKey=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
